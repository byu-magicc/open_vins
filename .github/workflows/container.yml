name: Container Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_run:
    name: Build and run multi-agent simulation
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Build container
        run: podman build --tag open-vins:ci --file Containerfile .

      - name: Run multi-agent simulation
        run: |
          mkdir -p runs
          podman run --rm \
            --volume "${PWD}/runs:/open_vins_ws/runs" \
            open-vins:ci \
            ./src/open_vins/run_multi_agent_experiment.sh

      - name: Verify results and plots
        run: |
          data_found=false
          while IFS= read -r -d '' result_file; do
            if (( $(wc -l < "${result_file}") >= 25 )); then
              data_found=true
              break
            fi
          done < <(find runs -type f -path '*/results/*' -print0)
          if [[ "${data_found}" != true ]]; then
            echo "No result file with at least 25 lines was created"
            exit 1
          fi

          plot_found=false
          while IFS= read -r -d '' plot_file; do
            if (( $(wc -c < "${plot_file}") >= 10000 )); then
              plot_found=true
              break
            fi
          done < <(find runs -type f -path '*/plots/*.svg' -print0)
          if [[ "${plot_found}" != true ]]; then
            echo "No non-empty SVG plot of at least 10 KB was created"
            exit 1
          fi
