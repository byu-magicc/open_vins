name: Container Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_run:
    name: Build and run multi-agent simulation
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Build container
        run: podman build --tag open-vins:ci --file Containerfile .

      - name: Run multi-agent simulation
        run: |
          mkdir -p results
          podman run --rm \
            --volume "${PWD}/results:/open_vins_ws/results" \
            open-vins:ci \
            ros2 launch ov_msckf multi_agent_mav_sim.launch.py \
              save_results:=true \
              results_path:=/open_vins_ws/results

      - name: Verify results output
        run: |
          mapfile -d '' result_files < <(find results -type f -print0)
          if (( ${#result_files[@]} == 0 )); then
            echo "No result files were created"
            exit 1
          fi
          for result_file in "${result_files[@]}"; do
            line_count=$(wc -l < "${result_file}")
            if (( line_count < 50 )); then
              echo "${result_file} has ${line_count} lines; expected at least 50"
              exit 1
            fi
          done
